id: web/npm/search-packages
version: 1.0.0
title: Search npm packages
description: Open npmjs.com and search for a package.
site_id: npm
origins:
  - https://www.npmjs.com
tags:
  - npm
  - search
aliases:
  - npm-search
params:
  query:
    type: string
    required: true
    description: Package name or search term (e.g. playwright)
requires_vault: []
steps:
  - navigate:
      url: "https://www.npmjs.com/search?q={{query}}"
  - wait:
      url_includes: "/search?q="
      timeout_ms: 20000
  - assert:
      url_includes: "npmjs.com/search"
pitfalls:
  - "npmjs.com often serves Cloudflare bot checks to headless browsers — URL assert is the stable smoke check."
  - "For headed/manual verify, you can add title_includes: '{{query}}' after the challenge clears."
